<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>白と黒</title>
    <!--
      GitHub Pages 用 SPA リダイレクト（spa-github-pages 方式）。
      存在しないパス（例 /charge）に直接アクセス／リロードすると
      GitHub はこの 404.html を返す。ここで一旦 /?/charge へ
      置き換え、index.html 側のスクリプトが元のパスへ復元する。
      pathSegmentsToKeep = 0 は独自ドメイン（ルート直下）用。
      プロジェクトページ（/shirotokuro/）に戻す場合は 1 にする。
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
